name: AI Code Review (OpenCodeReview)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          llm_url: https://api.z.ai/api/paas/v4
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN }}
          llm_model: glm-5.3-flash
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          language: Chinese
          max_tokens_budget: '2000000'
          effort: medium
