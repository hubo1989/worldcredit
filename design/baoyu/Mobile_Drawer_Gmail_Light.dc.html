      color: #5B6478;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sheet-body {
      padding: 18px 20px 36px 20px;
      overflow-y: auto;
    }
    .card-box {
      background: #F5F7FA;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .status-pill {

      font-weight: 600;

      background: #F0F4FA;
      color: #1E3A8A;
      border: 1px solid #D8DFE9;
    }
    .btn-danger {

      color: #B71C1C;
      border: 1px solid #D32F2F;
